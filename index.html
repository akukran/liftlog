<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#111317">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: a training partner — terse, confident, out of the way mid-set.
   IDEA: the gym's bumper plates and chalked logbook: numbers you can read from a bench.
   PICTURE: the live workout itself; a loaded bar on the start screen.
   COLOUR and TYPE: chalk/rubber ground, bumper-plate red for action, steel blue for completed sets; Barlow Condensed + Barlow.
   LAYOUT: one phone-width column, sticky header, bottom tab bar, sheets slide up from the bottom. */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;--bg:#111317;--card:#1b1e24;--ink:#eef1f5;--mut:#929aa6;--line:#2a2f37;--fld:#252931;--red:#2f7df6;--blue:#4ea1ff;--doneb:#13243b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0}
p{margin:0}.mut{color:var(--mut)}
.top{flex:none;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(4vw,16px) 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:32px}.top h1 b{color:var(--red)}
.sync{margin-left:auto;font-size:13px;color:var(--mut);text-align:right}
main{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px max(16px,calc((100% - 720px)/2)) 90px}
.tabs{flex:none;z-index:6;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{appearance:none;border:0;background:none;color:var(--mut);font:600 12px Barlow;min-height:62px;display:grid;justify-items:center;align-content:center;gap:2px;cursor:pointer}
.tabs button[aria-current=page]{color:var(--red)}.tabs svg{width:24px;height:24px}
.btn{appearance:none;border:0;border-radius:12px;min-height:46px;padding:0 18px;font:600 16px Barlow;cursor:pointer;background:var(--fld);color:var(--ink)}
.btn.pri{background:var(--red);color:#fff}.btn.ghost{background:none;border:1px solid var(--line)}.btn.wide{width:100%}.btn.sm{min-height:44px;padding:0 12px;font-size:15px}
.btn.danger{color:#ff6b5e}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.start{background:linear-gradient(160deg,#2f7df6,#1a4fb8);color:#fff;border-radius:20px;padding:24px 20px 20px;margin-bottom:22px;overflow:hidden}
.start svg{width:100%;height:auto;display:block;margin:-4px 0 14px}
.start h2{font-size:44px}.start p{opacity:.9;margin:6px 0 18px}
.start .btn{background:#fff;color:#1b4fae;font-size:18px;min-height:52px}
.sub{font-size:24px;margin:6px 0 12px}
.wk{display:grid;gap:4px}.wname{width:100%;border:0;background:none;color:var(--ink);font:700 32px/1.1 "Barlow Condensed";padding:2px 0}
.ex .exhead{display:flex;align-items:flex-start;gap:10px}
.exname{appearance:none;border:0;background:none;padding:0;color:var(--blue);text-align:left;cursor:pointer;font:700 24px/1.1 "Barlow Condensed"}
.last{font-size:14px;color:var(--mut);margin-top:4px}
.seg{display:inline-flex;background:var(--fld);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--mut);font:600 15px Barlow;min-width:46px;min-height:38px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0003}
.hd,.set{display:grid;grid-template-columns:26px minmax(0,1.25fr) minmax(0,1fr) minmax(0,.9fr) 46px;gap:7px;align-items:center}
.hd{font-size:13px;color:var(--mut);padding:12px 4px 4px}.hd span:nth-child(n+3){text-align:center}
.set{padding:4px;border-radius:12px;transition:background .25s}
.set.done{background:var(--doneb)}
.sn{font:700 19px "Barlow Condensed";text-align:center;color:var(--mut)}
.prev{border:0;background:none;color:var(--mut);font:500 15px Barlow;text-align:left;cursor:pointer;padding:0;min-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;height:46px;border:1px solid transparent;border-radius:10px;background:var(--fld);color:var(--ink);font:600 18px Barlow;text-align:center;padding:0 4px}
.set.done input{background:transparent}
.set input::placeholder{color:var(--mut);opacity:.65}
.chk{width:46px;height:46px;border-radius:10px;border:0;background:var(--fld);color:var(--mut);cursor:pointer;display:grid;place-items:center}
.set.done .chk{background:var(--blue);color:#fff}.chk svg{width:22px;height:22px}
.exfoot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.exfoot .btn{flex:1}
.hist h3{font-size:24px}.hl{list-style:none;padding:0;margin:12px 0}.hl li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.hl li span:last-child{white-space:nowrap}
.mhd{font:700 15px Barlow;color:var(--mut);margin:18px 0 8px}
.search{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Barlow;padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font:600 14px Barlow;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{list-style:none;margin:0;padding:0}
.lib button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:11px 4px;cursor:pointer;font:inherit;min-height:56px}
.lib .nm{font-weight:600}.lib .sm{font-size:14px;color:var(--mut);grid-column:1}.lib .rt{grid-row:1/3;grid-column:2;align-self:center;font-size:14px;color:var(--mut);text-align:right}
.lib button.on{background:var(--doneb)}.lib button.on .rt{color:var(--blue);font-weight:700}
.empty{padding:28px 8px;text-align:center;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stats div{background:var(--fld);border-radius:12px;padding:10px}.stats b{display:block;font:700 26px/1.1 "Barlow Condensed";white-space:nowrap}.stats span{font-size:13px;color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pills span{background:var(--fld);border-radius:8px;padding:2px 8px;font-size:14px;white-space:nowrap}
.sess{padding:10px 0;border-top:1px solid var(--line)}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:600;font-size:15px}
select,.field input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--fld);color:var(--ink);font:16px Barlow;padding:0 12px;width:100%}
.tog{display:flex;gap:12px;align-items:center;margin-top:14px;min-height:44px;cursor:pointer}.tog input{width:22px;height:22px;accent-color:var(--red)}
.card h3{font-size:24px;margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:720px;margin:0 auto;max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:18px max(4vw,16px) calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ph h2{font-size:30px;flex:1}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--fld);color:var(--ink);font-size:18px;cursor:pointer}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 4px}
.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:6;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;padding:8px max(4vw,16px);overflow:hidden}
.rest[hidden]{display:none}
.rest .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--red);transition:width .25s linear}
.rest b{font:700 30px "Barlow Condensed";min-width:70px}.rest span{flex:1;font-size:14px;opacity:.8}
.rest button{border:0;border-radius:10px;min-height:44px;min-width:50px;background:#ffffff22;color:inherit;font:600 15px Barlow;cursor:pointer}
:root[data-theme=light] .rest button{background:#ffffff22}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
.tier{display:inline-flex;align-items:center;gap:6px;font:700 14px Barlow;white-space:nowrap}
.tier i{width:12px;height:12px;border-radius:50%;background:var(--tc);box-shadow:inset 0 -2px 0 #0003;flex:none}
.big-tier{display:flex;align-items:center;gap:16px}
.medal{width:72px;height:72px;border-radius:50%;background:var(--tc);display:grid;place-items:center;color:#fff;font:700 30px "Barlow Condensed";box-shadow:inset 0 -6px 0 #0003,0 0 0 4px var(--card),0 0 0 6px var(--tc);flex:none}
.bodies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.bodies figure{margin:0;text-align:center}.bodies svg{width:100%;max-width:230px;height:auto}
.bodies figcaption{font-size:13px;color:var(--mut)}
.bodies [data-act]{cursor:pointer;stroke:var(--card);stroke-width:1.5;transition:opacity .15s}.bodies [data-act]:hover{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px}
.mrow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:12px 2px;text-align:left;cursor:pointer}
.mrow .nm{font-weight:600}.meter{grid-column:1/3;height:6px;border-radius:3px;background:var(--fld);overflow:hidden}.meter b{display:block;height:100%;background:var(--tc)}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.hh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.cal-head .x:disabled{opacity:.3;cursor:default}
.yr{font:700 36px/1 "Barlow Condensed"}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 18px;margin-top:6px}
.mon h4{margin:0 0 8px;font:700 17px "Barlow Condensed";display:flex;justify-content:space-between;gap:6px}.mon h4 span{font:500 13px Barlow;color:var(--mut)}
.dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.wd{font:600 11px Barlow;color:var(--mut);text-align:center}
.dot{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--fld);border:0;padding:0}
.dot.fut{opacity:.35}.dot.on{background:#2f7df6;box-shadow:0 0 8px #2f7df699;cursor:pointer}.dot.today{outline:2px solid var(--ink);outline-offset:1px}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.daynav b{font:700 24px "Barlow Condensed"}.daynav .x:disabled{opacity:.3}
.kcal{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.kcal b{font:700 52px/1 "Barlow Condensed"}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0 8px;border-top:1px solid var(--line);font-size:15px}.nrow:first-of-type{margin-top:12px}.nrow .meter{grid-column:1/3}.nrow>span:nth-child(2){color:var(--mut);white-space:nowrap}
.meter.over b{background:#ff6b5e!important}
.meal{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}.meal p{font-size:14px;color:var(--mut)}
textarea.food{min-height:96px;font:16px/1.45 Barlow;margin-top:10px}
textarea{width:100%;min-height:200px;border-radius:12px;border:1px solid var(--line);background:var(--fld);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px}
@media(max-width:380px){.hd,.set{grid-template-columns:22px minmax(0,1.1fr) minmax(0,1fr) minmax(0,.85fr) 44px;gap:5px}.prev{font-size:14px}.start h2{font-size:38px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header class="top"><h1>Lift<b>Log</b></h1><span id="sync" class="sync">Loading…</span></header>
<main id="main"></main>
<div id="rest" class="rest" hidden><b id="restT">1:30</b><span>Rest</span><button data-act="rest-" aria-label="Subtract 15 seconds">−15</button><button data-act="rest+" aria-label="Add 15 seconds">+15</button><button data-act="restskip">Skip</button><i class="bar" id="restB"></i></div>
<nav class="tabs" aria-label="Sections">
<button data-act="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Workout</button>
<button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
<button data-act="tab" data-tab="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Exercises</button>
<button data-act="tab" data-tab="ranks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Ranks</button>
<button data-act="tab" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>Food</button>
<button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>

const EQ={B:'Barbell',D:'Dumbbell',M:'Machine',C:'Cable',W:'Bodyweight',S:'Smith machine',K:'Kettlebell',E:'EZ bar',T:'Trap bar',P:'Plate-loaded',O:'Other'};
const MUSCLES=Object.keys(RAW);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const LIB=[];for(const m of MUSCLES)for(const it of RAW[m].split(';')){const[n,e]=it.split('|');LIB.push({id:slug(n),name:n,muscle:m,equip:EQ[e]})}
LIB.sort((a,b)=>a.name.localeCompare(b.name));

const S={settings:{unit:'kg',rest:90,remember:true,sets:3,matchSets:true,bw:null,bwu:'kg',sex:null},custom:[],workouts:[],active:null,food:{}};
let tab='workout',db=null,base='',wcol=null,fcol=null;
const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALL=()=>S.custom.length?[...LIB,...S.custom].sort((a,b)=>a.name.localeCompare(b.name)):LIB;
const exById=id=>LIB.find(x=>x.id===id)||S.custom.find(x=>x.id===id)||{id,name:id,muscle:'Other',equip:'Other'};
const r1=x=>Math.round(x*10)/10;
const fmt=x=>x==null?'':String(r1(x));
const conv=(v,f,t)=>v==null||f===t?v:(t==='lb'?v*2.20462262:v/2.20462262);
const e1rm=(v,r)=>!v||!r?0:r===1?v:v*(1+r/30);
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fdate=t=>{const d=new Date(t),y=d.getFullYear()!==new Date().getFullYear();return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',...(y?{year:'numeric'}:{})})};
const setTxt=(s,u,to)=>(s.v==null?'BW':fmt(conv(s.v,u,to)))+(to&&s.v!=null?'':'')+' × '+s.r;
const LOCALMSG='Saved on this device';

/* ---------- persistence ---------- */
const LS='liftlog.v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.settings={...S.settings,...d.settings};S.custom=d.custom||[];S.workouts=d.workouts||[];S.active=d.active||null;S.food=d.food&&typeof d.food==="object"?d.food:{}}}catch(e){}}
const pend={},busy={};
function put(k,fn){pend[k]=fn;flush(k)}
async function flush(k){if(busy[k]||!pend[k])return;busy[k]=1;const fn=pend[k];pend[k]=null;
  try{await fn();setSync('Synced')}catch(e){setSync(e&&e.code==='quota_exceeded'?'Storage full — saved on this device':'Not synced — saved on this device')}
  busy[k]=0;if(pend[k])flush(k)}
function saveSettings(){saveLocal();if(db)put('settings',()=>db.doc(base+'/settings').set({...S.settings}))}
function saveCustom(){saveLocal();if(db)put('custom',()=>db.doc(base+'/custom').set({list:S.custom}))}
let actT;
function saveActive(){if(S.active)S.active.updated=Date.now();saveLocal();clearTimeout(actT);
  actT=setTimeout(()=>{if(db)put('active',()=>S.active?db.doc(base+'/active').set(JSON.parse(JSON.stringify(S.active))):db.doc(base+'/active').delete())},700)}
function saveWorkout(w){saveLocal();if(db)put('w'+w.id,()=>wcol.doc(w.id).set(w))}
function delWorkout(id){saveLocal();if(db)put('w'+id,()=>wcol.doc(id).delete())}
function setSync(t){$('sync').textContent=t}

/* ---------- helpers ---------- */
function lastFor(eid,skip){for(const w of S.workouts){if(w.id===skip)continue;const e=w.ex.find(x=>x.eid===eid);if(e&&e.sets.length)return{w,e}}return null}
function unitFor(eid){const l=S.settings.remember&&lastFor(eid);return l?l.e.unit:S.settings.unit}
function bestSet(e){let b=null,bv=-1;for(const s of e.sets){const k=e1rm(s.v||0,s.r)||s.r/1000;if(k>bv){bv=k;b=s}}return b}
function addEx(eid){const l=lastFor(eid);S.active.ex.push({eid,unit:unitFor(eid),sets:Array.from({length:l&&S.settings.matchSets!==false?l.e.sets.length:(+S.settings.sets||3)},()=>({v:null,r:null,done:false}))})}
function startWorkout(src){const h=new Date().getHours();
  S.active={id:'w'+Date.now().toString(36),name:src?src.name:(h<12?'Morning':h<17?'Afternoon':'Evening')+' workout',start:Date.now(),ex:[]};
  if(src)src.ex.forEach(e=>addEx(e.eid));
  saveActive();tab='workout';render();main.scrollTo(0,0);if(!src)openPicker()}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000)}

/* ---------- views ---------- */
const BAR=`<svg viewBox="0 0 320 90" aria-hidden="true"><rect x="8" y="41" width="304" height="8" rx="4" fill="#ffffffcc"/><rect x="70" y="36" width="10" height="18" rx="2" fill="#fff"/><rect x="240" y="36" width="10" height="18" rx="2" fill="#fff"/>
${[[30,14,'#0e1116'],[46,10,'#15171a'],[58,8,'#f2c230']].map(([x,w,c])=>`<rect x="${x}" y="${45-(x===30?40:x===46?32:24)}" width="${w}" height="${x===30?80:x===46?64:48}" rx="3" fill="${c}"/><rect x="${320-x-w}" y="${45-(x===30?40:x===46?32:24)}" width="${w}" height="${x===30?80:x===46?64:48}" rx="3" fill="${c}"/>`).join('')}</svg>`;
function vWorkout(){
  if(!S.active){const n=S.workouts.length,last=S.workouts[0];
    return `<section class="start">${BAR}<h2>Ready to lift?</h2><p>${n?`${n} workout${n>1?'s':''} logged · last on ${fdate(last.start)}`:`${ALL().length} exercises in the library. Your last weights show up automatically.`}</p>
    <button class="btn wide" data-act="start">Start empty workout</button></section>
    ${n?`<h2 class="sub">Repeat a recent workout</h2>`+S.workouts.slice(0,5).map(w=>`<div class="card"><h3 style="font-size:22px">${esc(w.name)}</h3><p class="mut" style="font-size:14px;margin:4px 0 12px">${fdate(w.start)} · ${w.ex.map(e=>esc(exById(e.eid).name)).join(', ')}</p><button class="btn sm" data-act="repeat" data-id="${w.id}">Repeat workout</button></div>`).join(''):''}`}
  const A=S.active,done=A.ex.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  return `<div class="wk"><input id="wname" class="wname" value="${esc(A.name)}" aria-label="Workout name"><p class="mut"><span id="elapsed"></span> · ${done} set${done===1?'':'s'} done</p></div>
  <div style="height:14px"></div>${A.ex.map(exCard).join('')||`<div class="card empty">No exercises yet.</div>`}
  <button class="btn wide ghost" data-act="add" style="margin-bottom:14px">+ Add exercises</button>
  <div class="row"><button class="btn danger" data-act="discard">Discard</button><button class="btn pri" data-act="finish">Finish workout</button></div>`}
function exCard(e,i){
  const x=exById(e.eid),prev=lastFor(e.eid,S.active.id),u=e.unit;
  const rows=e.sets.map((s,j)=>{const p=prev&&prev.e.sets[j];const q=!p&&j?e.sets[j-1]:null;
    const pw=p?(p.v==null?'':fmt(conv(p.v,prev.e.unit,u))):q&&q.v!=null?fmt(q.v):'';const pr=p?p.r:q&&q.r!=null?q.r:'';
    return `<div class="set${s.done?' done':''}" data-i="${i}" data-j="${j}"><span class="sn">${j+1}</span>
    <button class="prev" data-act="fill" ${p?'':'disabled'} aria-label="Copy previous">${p?setTxt(p,prev.e.unit,u):'—'}</button>
    <input class="w" inputmode="decimal" data-f="v" value="${s.v??''}" placeholder="${pw}" aria-label="Weight set ${j+1}">
    <input class="r" inputmode="numeric" data-f="r" value="${s.r??''}" placeholder="${pr}" aria-label="Reps set ${j+1}">
    <button class="chk" data-act="done" aria-label="Complete set ${j+1}" aria-pressed="${s.done}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>`}).join('');
  return `<section class="card ex" data-i="${i}"><div class="exhead"><div style="flex:1"><button class="exname" data-act="info" data-id="${e.eid}">${esc(x.name)}</button>
  <p class="last">${prev?`Last · ${fdate(prev.w.start)}: ${prev.e.sets.map(s=>setTxt(s,prev.e.unit,u)).join(', ')}`:`${esc(x.muscle)} · ${esc(x.equip)} · first time`}</p></div>
  <div class="seg" role="group" aria-label="Unit">${['kg','lb'].map(k=>`<button data-act="unit" data-u="${k}" aria-pressed="${u===k}">${k}</button>`).join('')}</div></div>
  <div class="hd"><span>Set</span><span>Previous</span><span>${u}</span><span>Reps</span><span></span></div>${rows}
  <div class="exfoot"><button class="btn sm" data-act="addset">+ Add set</button><button class="btn sm" data-act="rmset" ${e.sets.length?'':'disabled'}>− Remove set</button><button class="btn sm danger" data-act="rmex">Remove</button></div></section>`}
function vList(){
  if(!S.workouts.length)return `<div class="card empty">Finished workouts land here, with every set you logged.</div>`;
  const U=S.settings.unit;let mon='';
  return S.workouts.map(w=>{
    const m=new Date(w.start).toLocaleDateString('en-GB',{month:'long',year:'numeric'});const hd=m!==mon?(mon=m,`<p class="mhd">${m}</p>`):'';
    const vol=w.ex.reduce((t,e)=>t+e.sets.reduce((a,s)=>a+(conv(s.v||0,e.unit,U))*s.r,0),0);
    const mins=w.end?Math.max(1,Math.round((w.end-w.start)/60000)):0;
    return hd+`<article class="card hist"><h3>${esc(w.name)}</h3><p class="mut" style="font-size:14px">${fdate(w.start)}${mins?` · ${mins} min`:''} · ${Math.round(vol).toLocaleString('en-GB')} ${U} volume</p>
    <ul class="hl">${w.ex.map(e=>{const b=bestSet(e);return `<li><span>${e.sets.length} × <button class="exname" style="font:600 16px Barlow" data-act="info" data-id="${e.eid}">${esc(exById(e.eid).name)}</button></span><span class="mut">${b?setTxt(b,e.unit,e.unit)+(b.v!=null?' '+e.unit:''):''}</span></li>`}).join('')}</ul>
    <div class="row"><button class="btn sm" data-act="repeat" data-id="${w.id}">Repeat</button><button class="btn sm ghost danger" data-act="delw" data-id="${w.id}">Delete</button></div></article>`}).join('')}
let histView='cal',calY=new Date().getFullYear();
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wkStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function vHistory(){return `<div class="hh"><h2 class="sub" style="margin:0">History</h2><div class="seg">${[['cal','Calendar'],['list','Workouts']].map(([k,l])=>`<button data-act="hv" data-v="${k}" aria-pressed="${histView===k}" style="padding:0 12px">${l}</button>`).join('')}</div></div>`+(histView==='cal'?vCal():vList())}
function vCal(){const days={};S.workouts.forEach(w=>{const k=dkey(w.start);(days[k]=days[k]||[]).push(w)});
  const now=new Date(),tk=dkey(now),cy=now.getFullYear();const ks=Object.keys(days);
  const minY=Math.min(cy,...S.workouts.map(w=>new Date(w.start).getFullYear()));
  const yr=ks.filter(k=>k.startsWith(calY+'-')).length,mo=ks.filter(k=>k.startsWith(tk.slice(0,7))).length;
  const weeks=new Set(S.workouts.map(w=>wkStart(w.start)));let st=0,cur=wkStart(Date.now());if(!weeks.has(cur))cur=wkStart(cur-3*864e5);while(weeks.has(cur)){st++;cur=wkStart(cur-3*864e5)}
  const months=MON.map((mn,m)=>{const lead=(new Date(calY,m,1).getDay()+6)%7,n=new Date(calY,m+1,0).getDate();let c=0,cells='<i></i>'.repeat(lead);
    for(let d=1;d<=n;d++){const k=calY+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const on=!!days[k];if(on)c++;const fut=k>tk;
      cells+=on?`<button class="dot on${k===tk?' today':''}" data-act="day" data-d="${k}" aria-label="${d} ${mn}, gym day"></button>`:`<i class="dot${fut?' fut':''}${k===tk?' today':''}"></i>`}
    return `<div class="mon"><h4>${mn.slice(0,3)}<span>${c?c+' day'+(c>1?'s':''):''}</span></h4><div class="dots">${['M','T','W','T','F','S','S'].map(x=>`<b class="wd">${x}</b>`).join('')}${cells}</div></div>`}).join('');
  return `<section class="card"><div class="cal-head"><button class="x" data-act="cy" data-d="-1" ${calY<=minY?'disabled':''} aria-label="Previous year">‹</button><span class="yr">${calY}</span><button class="x" data-act="cy" data-d="1" ${calY>=cy?'disabled':''} aria-label="Next year">›</button></div>
  <div class="stats"><div><b>${yr}</b><span>Gym days in ${calY}</span></div><div><b>${mo}</b><span>This month</span></div><div><b>${st}</b><span>Week streak</span></div></div>
  <div class="months">${months}</div><p class="note">Blue dots are days you trained — tap one to see the workout.</p></section>`}
function openDay(k){const ws=S.workouts.filter(w=>dkey(w.start)===k);if(!ws.length)return;
  openSheet(`<div class="ph"><h2>${fdate(ws[0].start)}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>`+ws.map(w=>`<div class="card"><h3>${esc(w.name)}</h3><ul class="hl">${w.ex.map(e=>`<li><span>${esc(exById(e.eid).name)}</span><span class="mut">${e.sets.map(s=>setTxt(s,e.unit,e.unit)).join(', ')}${e.sets.some(s=>s.v!=null)?' '+e.unit:''}</span></li>`).join('')}</ul><button class="btn sm" data-act="repeat" data-id="${w.id}">Repeat workout</button></div>`).join(''))}
let libQ='',libM='All',pickQ='',pickM='All',pickSel=new Set(),pickFrom=null;
const chips=(cur,act)=>{const rec=S.workouts.length?['Recent']:[];return [...rec,'All',...MUSCLES,...(S.custom.length?['Custom']:[])].map(m=>`<button class="chip" data-act="${act}" data-m="${m}" aria-pressed="${m===cur}">${m}</button>`).join('')};
function filt(q,m){const ws=q.trim().toLowerCase().split(/\s+/).filter(Boolean);let L=ALL();
  if(m==='Recent'){const seen=[];for(const w of S.workouts)for(const e of w.ex)if(!seen.includes(e.eid))seen.push(e.eid);L=seen.map(exById)}
  return L.filter(x=>(m==='All'||m==='Recent'||(m==='Custom'?x.custom:x.muscle===m))&&ws.every(w=>(x.name+' '+x.equip+' '+x.muscle).toLowerCase().includes(w)))}
function vLib(){return `<h2 class="sub">Exercises</h2><input id="libq" class="search" type="search" placeholder="Search ${ALL().length} exercises" value="${esc(libQ)}" autocomplete="off"><div class="chips" id="lchips">${chips(libM,'lm')}</div><ul class="lib" id="llist"></ul>
  <div style="margin-top:16px"><button class="btn wide ghost" data-act="newcustom">+ Create custom exercise</button></div>`}
function drawLib(){const L=filt(libQ,libM);const R=bwKg()&&S.settings.sex?rankAll().ex:{};$('llist').innerHTML=L.map(x=>{const l=lastFor(x.id);return `<li><button data-act="info" data-id="${x.id}"><span class="nm">${esc(x.name)}</span><span class="sm">${esc(x.muscle)} · ${esc(x.equip)}${R[x.id]?' · '+badge(R[x.id].s):''}</span><span class="rt">${l?setTxt(bestSet(l.e),l.e.unit,l.e.unit)+(bestSet(l.e).v!=null?' '+l.e.unit:'')+'<br>'+fdate(l.w.start):''}</span></button></li>`}).join('')||`<li class="empty">No matches.</li>`}
function vSettings(){const st=S.settings;
  return `<h2 class="sub">Settings</h2><section class="card"><h3>Weight unit</h3><p class="mut">Default for new exercises and workout totals. You can still switch any exercise mid-workout.</p>
  <div class="seg" style="margin-top:12px">${['kg','lb'].map(k=>`<button data-act="setunit" data-u="${k}" aria-pressed="${st.unit===k}" style="min-width:80px">${k==='kg'?'Kilograms':'Pounds'}</button>`).join('')}</div>

  <section class="card"><h3>Daily food goals</h3><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:8px 0 0">${[['kcal','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)']].map(([k,l])=>`<label class="field" style="margin:0"><span style="font-size:14px;font-weight:600">${l}</span><input inputmode="numeric" data-goal="${k}" value="${(st.goals||{})[k]??GDEF[k]}"></label>`).join('')}</div></section>
  <section class="card"><h3>Sets per exercise</h3><p class="mut">How many set rows a new exercise starts with.</p><div class="field"><select id="setsel" aria-label="Default sets">${[1,2,3,4,5,6,8,10].map(n=>`<option value="${n}" ${(+st.sets||3)===n?'selected':''}>${n} set${n>1?'s':''}</option>`).join('')}</select></div><label class="tog"><input type="checkbox" id="matchsets" ${st.matchSets!==false?'checked':''}> Use the same number as last time for exercises I've done before</label></section>
  <section class="card"><h3>Your data</h3><p class="mut">${db?'Synced to your Claude account, so it follows you across devices.':'Saved in this browser only.'} ${S.workouts.length} workouts, ${S.custom.length} custom exercises.</p>
  <div class="row" style="margin-top:12px"><button class="btn sm" data-act="export">Copy data as JSON</button><button class="btn sm" data-act="import">Import data</button><button class="btn sm ghost danger" data-act="wipe">Delete all history</button></div></section>`}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  main.innerHTML=tab==='workout'?vWorkout():tab==='history'?vHistory():tab==='lib'?vLib():tab==='ranks'?vRanks():tab==='food'?vFood():vSettings();
  if(tab==='lib')drawLib();tickElapsed()}
function tickElapsed(){const el=$('elapsed');if(el&&S.active){const s=Math.floor((Date.now()-S.active.start)/1000);el.textContent=(s>=3600?Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):mmss(s))}}

  <section class="card"><h3>By muscle</h3>${MUSCLES.map(m=>{const r=M[m];if(!r)return `<div class="mrow" style="cursor:default"><span class="nm">${m}</span><span class="mut" style="font-size:14px">Not trained yet</span></div>`;
    const i=tierIx(r.s),t=TIERS[i],nx=TIERS[i+1],p=nx?Math.min(100,Math.max(4,100*(r.s-t[1])/(nx[1]-t[1]))):100;
    return `<button class="mrow" data-act="muscle" data-m="${m}" style="--tc:${t[2]}"><span><span class="nm">${m}</span> <span class="mut" style="font-size:14px">· ${LEVEL[i]}</span></span>${badge(r.s)}<span class="meter"><b style="width:${p}%"></b></span></button>`}).join('')}
  <p class="note">Ranks compare your best estimated 1RM (from up to 12 reps) to typical advanced-lifter ratios for your bodyweight; Diamond ≈ advanced, Champion ≈ elite. Dumbbell lifts count weight per dumbbell; plate-loaded machines count the plates you load. A muscle's rank averages its two best exercises, and big compounds count partly toward helper muscles. Treat them as a guide, not gospel.</p></section>`}
function openMuscle(m){const{M}=rankAll();const r=M[m];
  const list=r?r.list.map(o=>{const x=exById(o.id);return `<li><button data-act="info" data-id="${o.id}"><span class="nm">${esc(x.name)}</span><span class="sm">${o.sec?'Helper muscle · ':''}${esc(x.equip)}</span><span class="rt">${badge(o.s)}</span></button></li>`}).join(''):'';
  openSheet(`<div class="ph"><h2>${m}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>${r?`<div class="big-tier" style="margin-bottom:12px"><div class="medal" style="--tc:${TIERS[tierIx(r.s)][2]}">${TIERS[tierIx(r.s)][0][0]}</div><div><h3 style="font-size:30px">${TIERS[tierIx(r.s)][0]}</h3><p class="mut">${LEVEL[tierIx(r.s)]}</p></div></div><ul class="lib">${list}</ul>`:`<p class="empty">No ranked ${m.toLowerCase()} exercises yet. Log one to get a rank.</p>`}`)}

/* ---------- sheets ---------- */
let sheetDone=null;
function openSheet(h){$('panel').innerHTML=h;$('sheet').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(v){$('sheet').hidden=true;document.body.style.overflow='';if(sheetDone){const f=sheetDone;sheetDone=null;f(v)}}
function ask(msg,ok){return new Promise(res=>{openSheet(`<h2 style="font-size:28px;margin-bottom:16px">${esc(msg)}</h2><div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="ok">${esc(ok)}</button></div>`);sheetDone=res})}
function openPicker(){pickSel=new Set();pickQ='';pickM='All';
  openSheet(`<div class="ph"><h2>Add exercises</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><input id="pq" class="search" type="search" placeholder="Search ${ALL().length} exercises" autocomplete="off"><div class="chips" id="pchips">${chips(pickM,'pm')}</div><ul class="lib" id="plist"></ul><div class="stick"><button class="btn pri wide" data-act="pickadd" id="pbtn">Select exercises</button></div>`);drawPick()}
function drawPick(){const L=filt(pickQ,pickM);const inW=new Set(S.active?S.active.ex.map(e=>e.eid):[]);
  $('plist').innerHTML=L.map(x=>`<li><button data-act="pick" data-id="${x.id}" class="${pickSel.has(x.id)?'on':''}"><span class="nm">${esc(x.name)}</span><span class="sm">${esc(x.muscle)} · ${esc(x.equip)}${inW.has(x.id)?' · in workout':''}</span><span class="rt">${pickSel.has(x.id)?'Added ✓':'Add'}</span></button></li>`).join('')
  ||`<li class="empty">Nothing matches “${esc(pickQ)}”.<br><button class="btn sm" style="margin-top:12px" data-act="newcustom" data-from="pick">Create “${esc(pickQ.trim()||'new exercise')}”</button></li>`;
  $('pbtn').textContent=pickSel.size?`Add ${pickSel.size} exercise${pickSel.size>1?'s':''}`:'Select exercises'}
function openCustom(from){pickFrom=from;openSheet(`<div class="ph"><h2>Custom exercise</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="field"><label for="cn">Name</label><input id="cn" value="${esc(from==='pick'?pickQ.trim():'')}" autocomplete="off"></div>
  <div class="field"><label for="cm">Muscle group</label><select id="cm">${MUSCLES.map(m=>`<option>${m}</option>`).join('')}</select></div>
  <div class="field"><label for="ce">Equipment</label><select id="ce">${Object.values(EQ).map(m=>`<option>${m}</option>`).join('')}</select></div>
  <button class="btn pri wide" data-act="savecustom" style="margin-top:8px">Save exercise</button>`)}
function openInfo(eid){const x=exById(eid),U=S.settings.unit;const hist=S.workouts.filter(w=>w.ex.some(e=>e.eid===eid));
  let best=0,heavy=null,hv=0;for(const w of hist)for(const e of w.ex)if(e.eid===eid)for(const s of e.sets){const v=conv(s.v||0,e.unit,U);best=Math.max(best,e1rm(v,s.r));if(v>hv){hv=v;heavy=`${fmt(v)} × ${s.r}`}}
  const canAdd=S.active&&!S.active.ex.some(e=>e.eid===eid);const sc=exScore(eid),st=stdFor(x);
  const rk=!bwKg()||!S.settings.sex?`<p class="note">Add your bodyweight in Ranks to see this exercise's rank.</p>`:sc?`<div class="card" style="margin:0 0 12px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div>${badge(sc.s)} <span class="mut">· ${LEVEL[tierIx(sc.s)]}</span><p class="note" style="margin-top:4px">${nextNeed(eid)}${st.approx?' Standard estimated from similar lifts.':''}</p></div></div>`:st?'':`<p class="note">This exercise isn't ranked.</p>`;
  openSheet(`<div class="ph"><h2>${esc(x.name)}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><p class="mut">${esc(x.muscle)} · ${esc(x.equip)}${x.custom?' · custom':''}</p>
  <div class="stats"><div><b>${best?fmt(best):'—'}</b><span>Best est. 1RM (${U})</span></div><div><b>${heavy||'—'}</b><span>Heaviest set</span></div><div><b>${hist.length}</b><span>Sessions</span></div></div>${rk}
  ${hist.length?hist.slice(0,15).map(w=>{const e=w.ex.find(e=>e.eid===eid);return `<div class="sess"><b>${fdate(w.start)}</b> <span class="mut">· ${e.unit}</span><div class="pills">${e.sets.map(s=>`<span>${setTxt(s,e.unit,e.unit)}</span>`).join('')}</div></div>`}).join(''):`<p class="empty">Not logged yet.</p>`}
  <div class="row" style="margin-top:16px">${canAdd?`<button class="btn pri" data-act="infoadd" data-id="${eid}">Add to workout</button>`:''}${!S.active?`<button class="btn pri" data-act="infostart" data-id="${eid}">Start workout with this</button>`:''}${x.custom?`<button class="btn ghost danger" data-act="delcustom" data-id="${eid}">Delete exercise</button>`:''}</div>`)}

/* ---------- rest timer ---------- */
let restEnd=0,restTot=0,restIv;
function startRest(){const t=+S.settings.rest;if(!t)return;restTot=t;restEnd=Date.now()+t*1000;$('rest').hidden=false;clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest()}
function stopRest(){clearInterval(restIv);$('rest').hidden=true}
function tickRest(){const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));$('restT').textContent=mmss(left);$('restB').style.width=(100*left/restTot)+'%';
  if(left<=0){stopRest();toast('Rest done — next set');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  if(ev.target===$('sheet')){closeSheet(false);return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,ci=b.closest('[data-i]'),i=ci?+ci.dataset.i:-1,cj=b.closest('[data-j]'),j=cj?+cj.dataset.j:-1,A=S.active;
  switch(a){
  case 'tab':tab=b.dataset.tab;render();main.scrollTo(0,0);break;
  case 'start':startWorkout(null);break;
  case 'repeat':{if(A&&!await ask('You already have a workout in progress. Replace it?','Replace'))break;const w=S.workouts.find(w=>w.id===b.dataset.id);if(w){closeSheet();startWorkout(w)}break}
  case 'add':openPicker();break;
  case 'unit':{const e=A.ex[i],u=b.dataset.u;if(e.unit===u)break;e.sets.forEach(s=>{if(s.v!=null)s.v=r1(conv(s.v,e.unit,u))});e.unit=u;saveActive();render();break}
  case 'fill':{const e=A.ex[i],p=lastFor(e.eid,A.id);const ps=p&&p.e.sets[j];if(!ps)break;const s=e.sets[j];s.v=ps.v==null?null:r1(conv(ps.v,p.e.unit,e.unit));s.r=ps.r;saveActive();render();break}
  case 'done':{const e=A.ex[i],s=e.sets[j];
    if(!s.done){const row=b.closest('.set'),wi=row.querySelector('.w'),ri=row.querySelector('.r');
      if(s.v==null&&wi.placeholder!=='')s.v=parseFloat(wi.placeholder);if(s.r==null&&ri.placeholder!=='')s.r=parseInt(ri.placeholder,10);
      if(!s.r){ri.focus();toast('Enter your reps first');break}s.done=true;startRest()}else s.done=false;
    saveActive();render();break}
  case 'addset':A.ex[i].sets.push({v:null,r:null,done:false});saveActive();render();break;
  case 'rmset':A.ex[i].sets.pop();saveActive();render();break;
  case 'rmex':if(await ask(`Remove ${exById(A.ex[i].eid).name} from this workout?`,'Remove')){A.ex.splice(i,1);saveActive();render()}break;
  case 'discard':if(await ask('Discard this workout? Nothing from it will be saved.','Discard')){S.active=null;saveActive();stopRest();render()}break;
  case 'finish':{const ex=A.ex.map(e=>({eid:e.eid,unit:e.unit,sets:e.sets.filter(s=>s.done&&s.r).map(s=>({v:s.v,r:s.r}))})).filter(e=>e.sets.length);
    if(!ex.length){if(await ask('No sets ticked off yet. Discard this workout?','Discard')){S.active=null;saveActive();stopRest();render()}break}
    const left=A.ex.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);
    if(left&&!await ask(`${left} set${left>1?'s are':' is'} not ticked off and won't be saved. Finish anyway?`,'Finish'))break;
    const w={id:A.id,name:A.name.trim()||'Workout',start:A.start,end:Date.now(),ex};
    S.workouts=[w,...S.workouts.filter(x=>x.id!==w.id)].sort((x,y)=>y.start-x.start);S.active=null;saveWorkout(w);saveActive();stopRest();tab='history';render();main.scrollTo(0,0);toast('Workout saved');break}
  case 'delw':if(await ask('Delete this workout from your history?','Delete')){const id=b.dataset.id;S.workouts=S.workouts.filter(w=>w.id!==id);delWorkout(id);render()}break;
  case 'info':openInfo(b.dataset.id);break;
  case 'infoadd':addEx(b.dataset.id);saveActive();closeSheet();tab='workout';render();toast('Added to workout');break;
  case 'infostart':closeSheet();startWorkout({name:null,ex:[{eid:b.dataset.id}]});S.active.name=exById(b.dataset.id).name+' session';saveActive();render();break;
  case 'lm':libM=b.dataset.m;$('lchips').innerHTML=chips(libM,'lm');drawLib();break;
  case 'pm':pickM=b.dataset.m;$('pchips').innerHTML=chips(pickM,'pm');drawPick();break;
  case 'pick':{const id=b.dataset.id;pickSel.has(id)?pickSel.delete(id):pickSel.add(id);b.classList.toggle('on');b.querySelector('.rt').textContent=pickSel.has(id)?'Added ✓':'Add';
    $('pbtn').textContent=pickSel.size?`Add ${pickSel.size} exercise${pickSel.size>1?'s':''}`:'Select exercises';break}
  case 'pickadd':if(!pickSel.size)break;pickSel.forEach(addEx);saveActive();closeSheet();render();break;
  case 'newcustom':openCustom(b.dataset.from||null);break;
  case 'savecustom':{const n=$('cn').value.trim();if(!n){$('cn').focus();break}
    if(ALL().some(x=>x.name.toLowerCase()===n.toLowerCase())){toast('That exercise already exists');break}
    const x={id:'c-'+(slug(n)||'ex')+'-'+Date.now().toString(36).slice(-4),name:n,muscle:$('cm').value,equip:$('ce').value,custom:true};
    S.custom.push(x);saveCustom();
    if(pickFrom==='pick'&&S.active){addEx(x.id);saveActive();closeSheet();render();toast('Added to workout')}else{closeSheet();render();toast('Exercise created')}break}
  case 'delcustom':if(await ask('Delete this custom exercise? Past sets stay in your history.','Delete')){S.custom=S.custom.filter(x=>x.id!==b.dataset.id);saveCustom();render()}break;
  case 'hv':histView=b.dataset.v;render();break;
  case 'cy':calY+=+b.dataset.d;render();break;
  case 'day':openDay(b.dataset.d);break;
  case 'fd':{const d=new Date(foodDay+'T12:00');d.setDate(d.getDate()+(+b.dataset.d));foodDay=dkey(d.getTime());render();break}
  case 'analyse':analyse();break;
  case 'askclaude':{const tx=($('foodtxt').value||'').trim();if(!tx){toast('Describe your food first');break}try{localStorage.setItem('liftlog.pend',JSON.stringify({tx,day:foodDay}))}catch(e){}
    const a=document.createElement('a');a.href='https://claude.ai/new?q='+encodeURIComponent(prompt2(tx));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();break}
  case 'pastefood':openSheet(`<div class="ph"><h2>Paste reply</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><p class="mut" style="margin-bottom:10px">Copy Claude’s whole reply and paste it here.</p><textarea id="pastet" placeholder="Paste here"></textarea><button class="btn pri wide" data-act="dopaste" style="margin-top:12px">Log meal</button>`);break;
  case 'dopaste':{const raw=$('pastet').value,ix=raw.lastIndexOf('LIFTLOG'),s=ix>=0?raw.slice(ix):raw,a1=s.indexOf('{'),a2=s.lastIndexOf('}');let p={};try{p=JSON.parse(localStorage.getItem('liftlog.pend')||'{}')}catch(e){}
    try{const o=JSON.parse(s.slice(a1,a2+1));addMeal(p.tx||'Meal',o,p.day);try{localStorage.removeItem('liftlog.pend')}catch(e){}if(p.day)foodDay=p.day;closeSheet();tab='food';render();toast('Meal logged')}catch(e){toast('Couldn’t find the numbers in that reply')}break}
  case 'delmeal':if(await ask('Delete this meal?','Delete')){S.food[foodDay]=(S.food[foodDay]||[]).filter(m=>m.id!==b.dataset.id);saveFood(foodDay);render()}break;
  case 'muscle':openMuscle(b.dataset.m);break;
  case 'bwu':{const st=S.settings,u=b.dataset.u;if(st.bwu===u)break;if(st.bw)st.bw=r1(conv(st.bw,st.bwu,u));st.bwu=u;saveSettings();render();break}
  case 'sex':S.settings.sex=b.dataset.s;saveSettings();render();break;
  case 'close':closeSheet(false);break;
  case 'ok':closeSheet(true);break;
  case 'setunit':S.settings.unit=b.dataset.u;saveSettings();render();break;
  case 'export':{const t=JSON.stringify({workouts:S.workouts,custom:S.custom,settings:S.settings,food:S.food},null,1);
    try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){openSheet(`<div class="ph"><h2>Your data</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><textarea readonly>${esc(t)}</textarea>`)}break}
  case 'import':openSheet(`<div class="ph"><h2>Import data</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><p class="mut" style="margin-bottom:10px">Paste data copied with “Copy data as JSON” from another copy of Lift Log. Workouts are merged; nothing is deleted.</p><textarea id="impt" placeholder="Paste here"></textarea><button class="btn pri wide" data-act="doimport" style="margin-top:12px">Import</button>`);break;
  case 'doimport':{let d;try{d=JSON.parse($('impt').value)}catch(e){toast('That isn’t valid data');break}
    const ws=Array.isArray(d.workouts)?d.workouts.filter(w=>w&&w.id&&Array.isArray(w.ex)):[];const have=new Set(S.workouts.map(w=>w.id));const nw=ws.filter(w=>!have.has(w.id));
    S.workouts=[...S.workouts,...nw].sort((a,b)=>b.start-a.start);nw.forEach(saveWorkout);
    const cs=Array.isArray(d.custom)?d.custom.filter(x=>x&&x.id&&!S.custom.some(c=>c.id===x.id)):[];if(cs.length){S.custom.push(...cs);saveCustom()}
    if(d.settings&&!S.settings.bw){S.settings={...S.settings,...d.settings};saveSettings()}
    if(d.food&&typeof d.food==="object")for(const k in d.food)if(!S.food[k]&&Array.isArray(d.food[k])){S.food[k]=d.food[k];saveFood(k)}
    saveLocal();closeSheet();render();toast(`Imported ${nw.length} workout${nw.length===1?'':'s'}`);break}
  case 'wipe':if(await ask(`Delete all ${S.workouts.length} workouts? This can't be undone.`,'Delete all')){const ids=S.workouts.map(w=>w.id);S.workouts=[];ids.forEach(delWorkout);render()}break;
  case 'rest+':restEnd+=15000;restTot=Math.max(restTot,Math.ceil((restEnd-Date.now())/1000));tickRest();break;
  case 'rest-':restEnd-=15000;tickRest();break;
  case 'restskip':stopRest();break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='wname'){S.active.name=t.value;saveActive();return}
  if(t.dataset.f){const row=t.closest('.set'),s=S.active.ex[+row.dataset.i].sets[+row.dataset.j];const n=parseFloat(t.value.replace(',','.'));s[t.dataset.f]=isNaN(n)?null:(t.dataset.f==='r'?Math.round(n):n);saveActive();return}
  if(t.id==='libq'){libQ=t.value;drawLib()}
  if(t.id==='pq'){pickQ=t.value;drawPick()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='restsel'){S.settings.rest=+t.value;saveSettings()}
  if(t.id==='setsel'){S.settings.sets=+t.value;saveSettings()}
  if(t.id==='matchsets'){S.settings.matchSets=t.checked;saveSettings()}
  if(t.dataset.goal){const n=parseInt(t.value,10);S.settings.goals={...GDEF,...(S.settings.goals||{})};if(n>0)S.settings.goals[t.dataset.goal]=n;saveSettings()}
  if(t.id==='foodimg'){const v=$('foodtxt').value;foodImg=t.files[0]||null;render();$('foodtxt').value=v}
  if(t.id==='remember'){S.settings.remember=t.checked;saveSettings()}
  if(t.id==='bwin'){const n=parseFloat(t.value.replace(',','.'));S.settings.bw=n>20&&n<700?n:null;saveSettings();if(tab==='ranks')render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('sheet').hidden)closeSheet(false)});

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
/* ---------- start ---------- */
loadLocal();render();setSync(LOCALMSG);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
(async()=>{const c=window.claude;if(!c||!c.use)return;
  try{const[d,u]=await Promise.all([c.use('db'),c.use('user')]);const id=u?await u.id():null;if(!d||!id)return;
    const B='data/users/'+id,col=d.doc(B+'/log').collection('workouts');setSync('Syncing…');
    const to=setTimeout(()=>setSync('Can’t reach sync yet — saving on this device'),10000);
    const[st,cu,ac,ws]=await Promise.all([d.doc(B+'/settings').get(),d.doc(B+'/custom').get(),d.doc(B+'/active').get(),col.get()]);
    clearTimeout(to);db=d;base=B;wcol=col;const cl=x=>JSON.parse(JSON.stringify(x));
    if(st.exists)S.settings={...S.settings,...cl(st.data())};else saveSettings();
    const rc=cu.exists?cl(cu.data()).list||[]:[];const cids=new Set(rc.map(x=>x.id));const lc=S.custom.filter(x=>!cids.has(x.id));S.custom=[...rc,...lc];if(lc.length||!cu.exists&&S.custom.length)saveCustom();
    const rw=ws.docs.filter(x=>x.exists).map(x=>cl(x.data()));const wids=new Set(rw.map(w=>w.id));const lw=S.workouts.filter(w=>!wids.has(w.id));
    S.workouts=[...rw,...lw].sort((a,b)=>b.start-a.start);lw.forEach(saveWorkout);
    const ra=ac.exists?cl(ac.data()):null;const fin=new Set(S.workouts.map(w=>w.id));
    if(ra&&!fin.has(ra.id)&&(!S.active||(ra.updated||0)>(S.active.updated||0)))S.active=ra;
    if(S.active&&fin.has(S.active.id))S.active=null;
    saveActive();saveLocal();setSync('Synced');
    try{fcol=d.doc(B+'/food').collection('days');const fs=await fcol.get();const rf={};fs.docs.filter(x=>x.exists).forEach(x=>{rf[x.id]=cl(x.data()).meals||[]});for(const k in S.food)if(!rf[k])saveFood(k);S.food={...S.food,...rf};saveLocal()}catch(e){}
    const f=document.activeElement;if(!(f&&f.tagName==='INPUT'))render();
  }catch(e){setSync(LOCALMSG)}})();
}
</script>
